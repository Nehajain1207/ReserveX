spring.application.name=ticketreservation

spring.datasource.url=jdbc:postgresql://localhost:5434/ticketreservation
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Override in real deployments with the JWT_SECRET environment variable (min 32 characters)
jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
